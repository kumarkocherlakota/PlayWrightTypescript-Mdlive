# Weekly update pull requests; they run through the pull-request and security workflows.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cucumber:
        patterns: ['@cucumber/*']
      lint:
        patterns: ['eslint*', '@eslint/*', 'typescript-eslint', 'prettier']
  - package-ecosystem: github-actions
    directories: ['/', '/.github/actions/*']
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
